name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style
        run: composer cs-check

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test -- --coverage-text

      # Reflects over src/ and fails if a public method is missing from
      # docs/api/*.md, or if the reference documents something that no longer
      # exists. The same script gates the docs deploy.
      - name: Docs reference drift
        run: composer docs-check

      - name: Security audit
        run: composer audit
