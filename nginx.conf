# Serves the rendered MkDocs site inside the image (replaces nginx:alpine's default.conf).
#
# Unlike the estate's single-page static sites, this is a multi-page site using mkdocs's
# directory URLs (/installation/ → /installation/index.html), so the trailing-slash
# redirect behaviour below is load-bearing rather than incidental.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ayula intercepts 404s and serves the branded twobots.dev page, but this keeps the
    # version out of anything reached directly over the LAN.
    server_tokens off;

    # THE ONE THAT BITES. mkdocs links pages as /installation/ (no .html). Requesting
    # /installation makes nginx issue a 301 to add the slash — and by default it builds
    # that Location from the LISTEN port, so behind Ayula it emits
    # `http://framework.twobots.dev:80/installation/`, leaking the container port into a
    # public redirect. absolute_redirect off makes it a relative Location instead.
    absolute_redirect off;
    # Paired with the above: use the Host header from Ayula rather than server_name (`_`).
    server_name_in_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # A docs site is almost entirely text, so this list earns more here than elsewhere.
    # The search index in particular is a large JSON file downloaded by every visitor
    # who opens the search box.
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    # NB: woff2 is already compressed — deliberately absent.

    # HTML changes on every deploy and must revalidate. The theme's assets are
    # content-hashed by mkdocs-material, so they are safe to cache hard.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # mkdocs-material fingerprints these filenames (assets/javascripts/bundle.<hash>.js),
    # so a new build is a new URL and a long cache can never serve a stale bundle.
    #
    # NB `expires 30d` is deliberately NOT used alongside this. It emits its own
    # `Cache-Control: max-age=…`, so the two directives together send the header TWICE and
    # clients that honour the first one silently lose `immutable`.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # NOT under /assets/ and NOT content-hashed — mkdocs rewrites this file in place on
    # every build, so it must revalidate or search silently returns last release's pages.
    location = /search/search_index.json {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
}
